name: probe-cli-hang
on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: validate x6, thread state of any CLI run alive past 4s
        env:
          PROBE_REPORT_DIR: ${{ runner.temp }}/reports
        run: |
          mkdir -p "$PROBE_REPORT_DIR"
          for i in $(seq 1 6); do
            bun run validate > "$RUNNER_TEMP/run-$i.log" 2>&1 || echo "run $i failed"
          done
          for d in "$PROBE_REPORT_DIR"/hang-*; do [ -d "$d" ] && { echo "== $d"; cat "$d/ps.txt" "$d/tasks.txt"; }; done
          echo "hangs: $(ls -d "$PROBE_REPORT_DIR"/hang-* 2>/dev/null | wc -l)"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/reports
            ${{ runner.temp }}/run-*.log
